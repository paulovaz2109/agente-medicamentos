name: Agente Medicamentos

on:
  schedule:
    # Roda todo dia as 11:00 UTC = 08:00 horario de Brasilia
    - cron: '0 11 * * *'
  workflow_dispatch:   # Permite rodar manualmente pelo botao no GitHub

jobs:
  verificar-estoque:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar os arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: pip install openpyxl twilio python-dotenv

      - name: Executar o agente
        env:
          TWILIO_ACCOUNT_SID:   ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:    ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          MEUS_NUMEROS:         ${{ secrets.MEUS_NUMEROS }}
        run: python agente_medicamentos.py
